services:
  - type: web
    name: naqsh-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@dtc/backend
    startCommand: cd apps/backend/.medusa/server && npm run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
